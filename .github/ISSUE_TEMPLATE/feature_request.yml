name: Feature request
description: Propose an engineering, validation or documentation improvement.
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Include correctness, reproducibility and performance gates if applicable.
    validations:
      required: true
